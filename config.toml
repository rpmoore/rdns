# rdns runtime configuration.
#
# Loaded on startup, and re-loaded on SIGHUP (resolution, upstreams, and
# local_dns_entries — dns_listen changes require a restart). Override the
# path with the RDNS_CONFIG environment variable; if neither RDNS_CONFIG
# nor this file is present, rdns falls back to built-in loopback
# development defaults.

# Bind loopback:5300 by default so `cargo run` works without root.
# For real LAN use, bind :53 on a LAN-facing address (e.g. "0.0.0.0:53")
# and run with root or `setcap cap_net_bind_service=+ep` on the built binary.
dns_listen = ["127.0.0.1:5300"]
per_query_deadline_ms = 2000
max_udp_payload_size = 1232

# Upstream resolvers used for anything not answered locally, tried in
# priority order (lower number first).
[[upstreams]]
name = "cloudflare"
endpoint = "1.1.1.1:53"
protocol = "udp"
enabled = true
priority = 10
timeout_ms = 750

# Local DNS entries answer exact names for devices on your network.
# public_address_acknowledged must be true if ipv4/ipv6 contain a
# public/routable address (private/loopback/link-local addresses don't
# need it).
#
# Example entry — disabled by default so a fresh checkout of this file
# doesn't answer a fake "nas.lan" record on your real network. Copy it,
# fill in your own device's name/address, and flip enabled to true.
[[local_dns_entries]]
name = "nas.lan"
ipv4 = ["192.168.1.10"]
ttl = 300
enabled = false
public_address_acknowledged = false
