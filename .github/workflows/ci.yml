name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Compile check
        run: cargo check --locked --all-targets --all-features

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny check

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo-audit
        run: cargo audit --deny warnings

      - name: Install reuse
        run: |
          python3 -m pip install --user reuse==6.2.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run reuse lint
        run: reuse lint

      - name: Run unit tests
        run: cargo test --locked --lib --bins

      - name: Run integration tests
        run: cargo test --locked --test forwarding --test recursive_perf --test cache_concurrency_bench

      - name: Run e2e tests
        run: cargo test --locked --test e2e_config_toml

      - name: Run live e2e tests
        run: cargo test --locked --test e2e_upstream_live -- --ignored --test-threads=1

  recursive-resolver-perf:
    name: Recursive resolver perf (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run recursive resolver perf tests
        run: cargo test --locked --release --test recursive_perf -- --ignored --nocapture --test-threads=1

  bundled-data-freshness:
    name: Bundled IANA data freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check bundled IANA data freshness
        run: just check-bundled-data-freshness

  okf-lint:
    name: Lint OKF knowledge docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run okf-lint
        run: |
          docker run --rm -v "$PWD/docs/knowledge":/data:ro \
            rpmoore/okf-lint@sha256:5d653a1fc2bd6d007cfc181205de9fc1d1acd6874360b53688cbc4a7fc9da333 /data
