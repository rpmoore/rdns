name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify release tag matches Cargo.toml version
        run: |
          cargo_version="$(cargo metadata --no-deps --format-version=1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$RELEASE_TAG" != "v$cargo_version" ]; then
            echo "::error::release tag '$RELEASE_TAG' does not match Cargo.toml version 'v$cargo_version' — bump Cargo.toml and merge before tagging"
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary
        run: tar czf "rdns-${RELEASE_TAG}-linux-x86_64.tar.gz" -C target/release rdns

      - name: Checksum tarball
        run: sha256sum "rdns-${RELEASE_TAG}-linux-x86_64.tar.gz" > "rdns-${RELEASE_TAG}-linux-x86_64.tar.gz.sha256"

      - name: Upload release asset and generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" "rdns-${RELEASE_TAG}-linux-x86_64.tar.gz" "rdns-${RELEASE_TAG}-linux-x86_64.tar.gz.sha256" --clobber
          notes="$(gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name="$RELEASE_TAG" --jq .body)"
          gh release edit "$RELEASE_TAG" --notes "$notes"
